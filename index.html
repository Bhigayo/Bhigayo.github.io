<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abdulmalik OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* VOICE: a 1990s personal computer that belongs to a software engineering student, a little cheeky.
   IDEA: the portfolio is the computer itself: power it on, watch it boot, open projects as apps.
   PICTURE: a glowing CRT: BIOS text, a loading splash, then a teal desktop with chunky windows and pixel icons.
   COLOUR/TYPE: phosphor green or amber on black for system text; teal desk, cream windows, ink borders; VT323 + Pixelify Sans.
   LAYOUT: full-screen screen; menu bar on top, icons down the left, windows float; on phones windows open full width. */
:root{color-scheme:dark;--ph:#5cff8a;--desk:#1f7a78;--desk2:#17605e;--win:#f4efe2;--ink:#111;--sel:#1b2a8f;--acc:#ff5f3a}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
body.amber{--ph:#ffb347}body.upside{--desk:#2a0d12;--desk2:#1a070b;--sel:#b3122e;--ph:#ff4d5e}body.midnight{--desk:#1b1f4a;--desk2:#121533;--sel:#5b3fd1}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{font:18px/1.3 "Pixelify Sans",system-ui,sans-serif;color:var(--ink)}
#crt{position:fixed;inset:0;overflow:hidden;background:#000}
.scr{position:absolute;inset:0;display:none}.scr.on{display:block}
/* CRT effects */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);
 animation:flick 4s infinite}
body.nofx #fx{display:none}
@keyframes flick{0%,100%{opacity:1}47%{opacity:.93}48%{opacity:1}72%{opacity:.96}}
.glow{color:var(--ph);text-shadow:0 0 4px var(--ph),0 0 14px color-mix(in srgb,var(--ph) 45%,transparent)}
/* power */
#off{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;cursor:pointer;text-align:center;padding:20px}
#off .big{font:400 clamp(30px,6vw,56px)/1 "VT323",monospace}
#off .blink{animation:bl 1s steps(1) infinite;font:400 24px "VT323",monospace}
@keyframes bl{50%{opacity:0}}
.pon{animation:pon .6s ease-out}
@keyframes pon{0%{transform:scale(1,.004);filter:brightness(4)}40%{transform:scale(1,.004)}70%{transform:scale(1,1.02)}100%{transform:none}}
.poff{animation:poff .7s ease-in forwards}
@keyframes poff{0%{transform:none}50%{transform:scale(1,.004);filter:brightness(3)}85%{transform:scale(.002,.004)}100%{transform:scale(0,0);opacity:0}}
/* bios */
#bios{padding:clamp(16px,4vw,48px);font:400 clamp(18px,2.6vw,26px)/1.25 "VT323",monospace;white-space:pre-wrap;overflow:hidden}
#bios .hint{position:absolute;bottom:20px;right:24px;opacity:.7}
/* splash */
#splash{display:none;align-items:center;justify-content:center;flex-direction:column;gap:26px;text-align:center;background:radial-gradient(circle at 50% 40%,#0c2b2a,#000 70%)}
#splash.on{display:flex}
.logo{font:700 clamp(40px,9vw,92px)/.9 "Pixelify Sans",sans-serif;letter-spacing:.02em}
.logo small{display:block;font:400 clamp(18px,3vw,26px) "VT323",monospace;letter-spacing:.3em;margin-top:10px}
.lbar{width:min(80vw,420px);height:30px;border:3px solid var(--ph);padding:3px;display:flex;gap:3px;box-shadow:0 0 12px color-mix(in srgb,var(--ph) 40%,transparent)}
.lbar i{flex:1;background:var(--ph);opacity:0;transition:opacity .1s}
.lmsg{font:400 22px "VT323",monospace;min-height:1.2em}
/* desktop */
#desk{background:var(--desk);background-image:radial-gradient(color-mix(in srgb,var(--desk2) 80%,transparent) 1px,transparent 1.4px);background-size:6px 6px}
.menubar{position:absolute;top:0;left:0;right:0;height:38px;background:var(--win);border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:4px;padding:0 8px;z-index:40}
.menubar button{font:600 17px "Pixelify Sans",sans-serif;background:none;border:0;padding:0 10px;height:34px;cursor:pointer;color:var(--ink)}
.menubar button:hover,.menubar button[aria-expanded=true]{background:var(--sel);color:#fff}
.menubar .clock{margin-left:auto;font:400 22px "VT323",monospace;padding:0 8px}
.drop{position:absolute;top:38px;left:8px;background:var(--win);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);z-index:41;display:none;min-width:220px}
.drop.on{display:block}
.drop button{display:block;width:100%;text-align:left;font:17px "Pixelify Sans",sans-serif;background:none;border:0;padding:10px 14px;cursor:pointer;min-height:44px}
.drop button:hover{background:var(--sel);color:#fff}.drop hr{border:0;border-top:2px dotted var(--ink);margin:2px 0}
.icons{position:absolute;top:52px;left:10px;bottom:10px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,98px);grid-auto-columns:96px;gap:4px;z-index:1}
.ico{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;cursor:pointer;padding:6px 2px;color:#fff;font:15px/1.15 "Pixelify Sans",sans-serif;text-align:center;text-shadow:1px 1px 0 #000}
.ico svg{width:48px;height:48px;image-rendering:pixelated;filter:drop-shadow(2px 2px 0 #0007)}
.ico:focus-visible span,.ico:active span{background:var(--sel);outline:1px dotted #fff}
.win{position:absolute;background:var(--win);border:2px solid var(--ink);box-shadow:5px 5px 0 #0009;display:flex;flex-direction:column;max-width:calc(100vw - 16px);max-height:calc(100vh - 54px);z-index:10;animation:wopen .18s ease-out}
@keyframes wopen{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.tb{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px;border-bottom:2px solid var(--ink);cursor:grab;touch-action:none;user-select:none;
 background:repeating-linear-gradient(0deg,var(--win) 0 3px,var(--ink) 3px 4px)}
.win.inactive .tb{background:var(--win)}
.tb .x{width:22px;height:22px;border:2px solid var(--ink);background:var(--win);cursor:pointer;flex:none;padding:0;position:relative}
.tb .x::after{content:"";position:absolute;inset:4px;background:var(--ink);transform:scale(0)}.tb .x:hover::after{transform:none}
.tb b{background:var(--win);padding:0 10px;margin:0 auto;font:600 17px "Pixelify Sans",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{overflow:auto;padding:16px;flex:1;font-size:17px}
.wb h2{font:700 30px/1 "Pixelify Sans",sans-serif;margin:0 0 8px}
.wb p{margin:0 0 10px}
.tag{display:inline-block;border:2px solid var(--ink);padding:1px 8px;font-size:15px;margin:0 6px 6px 0}
.tag.live{background:#5cff8a}.tag.soon{background:#ffd76a}
.btn{font:600 17px "Pixelify Sans",sans-serif;border:2px solid var(--ink);background:var(--win);box-shadow:3px 3px 0 var(--ink);padding:8px 16px;min-height:44px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.folder{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.folder .ico{color:var(--ink);text-shadow:none}
.term{background:#050805;padding:14px;font:400 21px/1.25 "VT323",monospace;height:100%;min-height:300px;overflow:auto;cursor:text}
.term .ln{white-space:pre-wrap;overflow-wrap:anywhere}
.term form{display:flex;gap:8px}.term input{flex:1;background:transparent;border:0;color:var(--ph);font:inherit;outline:none;min-height:30px;text-shadow:0 0 4px var(--ph)}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 10px;font:400 22px "VT323",monospace}
.hg{width:34px;height:34px;border:3px solid var(--ink);border-radius:50%;border-top-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mini{height:18px;width:220px;border:2px solid var(--ink);padding:2px}.mini i{display:block;height:100%;background:var(--sel);width:0;transition:width .5s steps(6)}
.card{display:grid;gap:8px;font-size:18px}.card a{color:var(--sel)}
.lock{background:#000;color:var(--ph);font:400 22px/1.3 "VT323",monospace;padding:18px;text-align:center}
.lock .big{font-size:44px;letter-spacing:.1em;animation:gl 1.2s infinite steps(2)}
@keyframes gl{0%{transform:translate(0)}25%{transform:translate(-3px,1px);text-shadow:3px 0 #ff2a6d,-3px 0 #05d9e8}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,2px);text-shadow:-3px 0 #ff2a6d,3px 0 #05d9e8}}
.set{display:grid;gap:12px}.set .row{display:flex;flex-wrap:wrap;gap:8px}
.set .btn[aria-pressed=true]{background:var(--sel);color:#fff}
/* bsod */
#bsod{background:#0b2bb0;color:#fff;font:400 clamp(20px,2.8vw,28px)/1.35 "VT323",monospace;padding:clamp(20px,8vw,120px);cursor:pointer}
#bsod .t{background:#c6c6c6;color:#0b2bb0;padding:0 10px;display:inline-block;margin-bottom:20px}
#bye{display:none;align-items:center;justify-content:center;text-align:center;font:400 clamp(26px,4vw,40px) "VT323",monospace;color:#ff9b3d;padding:20px;cursor:pointer}
#bye.on{display:flex}
:root{--cy:#19f0ff;--mg:#ff2bd6;--gr:#3dff9a;--rd:#ff3b5c;--am:#ffb020}
#city{background:#03060d;color:#cfefff;font:16px/1.4 "Share Tech Mono",monospace}
#ccv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.hud{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 14px;background:linear-gradient(#03060dee,#03060d00);z-index:3;pointer-events:none}
.hud b{font:900 18px "Orbitron",sans-serif;color:var(--cy);letter-spacing:.12em;text-shadow:0 0 10px var(--cy)}
.hud .vit{display:flex;align-items:center;gap:8px}.hud #vnum{font:700 22px "Orbitron",sans-serif;min-width:3ch}
.hud .hr{margin-left:auto}
.hud button{pointer-events:auto;font:700 14px "Orbitron",sans-serif;letter-spacing:.12em;color:var(--cy);background:#03060d;border:1px solid var(--cy);min-height:40px;padding:0 14px;cursor:pointer}
.clog{position:absolute;left:14px;bottom:12px;z-index:3;pointer-events:none;display:grid;gap:2px;font-size:14px;max-width:min(90vw,520px)}
.clog div{color:var(--cy);text-shadow:0 0 6px #19f0ff88;background:#03060dcc;padding:1px 6px;justify-self:start}
.clog .bad{color:var(--rd)}.clog .ok{color:var(--gr)}
.cpanel{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 40%,#0a1a3acc,#03060df2 70%)}
.cpanel.on{display:flex}
.cbox{width:min(560px,100%);border:1px solid var(--cy);box-shadow:0 0 24px #19f0ff55,inset 0 0 24px #19f0ff22;background:#050b18ee;padding:clamp(18px,4vw,30px);display:grid;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.cbox h2{font:900 clamp(28px,6vw,44px)/1 "Orbitron",sans-serif;margin:0;color:#fff;letter-spacing:.06em;text-shadow:0 0 14px var(--cy)}
.cbox h2.bad{text-shadow:0 0 14px var(--rd);color:#ffd6dc}.cbox h2.ok{text-shadow:0 0 14px var(--gr)}
.cbox p{margin:0}.cbox .k{color:var(--cy)}
.cbtns{display:flex;flex-wrap:wrap;gap:10px}
.cbtn{font:700 15px "Orbitron",sans-serif;letter-spacing:.1em;color:#03060d;background:var(--cy);border:0;min-height:48px;padding:0 18px;cursor:pointer;box-shadow:0 0 14px #19f0ff88;text-align:left}
.cbtn small{display:block;font:12px "Share Tech Mono",monospace;letter-spacing:0;opacity:.8}
.cbtn.ghost{background:transparent;color:var(--cy);border:1px solid var(--cy);box-shadow:none}
.cbtn.mg{background:var(--mg);box-shadow:0 0 14px #ff2bd688}
.cstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cstats div{border:1px solid #19f0ff55;padding:8px}.cstats b{display:block;font:700 22px "Orbitron",sans-serif;color:#fff}
.jack{display:grid;gap:10px;justify-items:center;text-align:center;width:min(520px,100%)}
.ring{width:96px;height:96px;border-radius:50%;border:3px solid #19f0ff33;border-top-color:var(--cy);border-right-color:var(--mg);animation:sp .8s linear infinite;box-shadow:0 0 20px #19f0ff55}
.pct{font:900 40px "Orbitron",sans-serif;color:#fff;text-shadow:0 0 12px var(--cy)}
.hex{font-size:13px;color:#19f0ff99;height:96px;overflow:hidden;width:100%;text-align:left;white-space:pre}
.jmsg{color:var(--mg);letter-spacing:.14em;min-height:1.4em}
.uplink{position:absolute;inset:0;z-index:6;background:#0a2bff;display:none;align-items:center;justify-content:center;font:900 clamp(26px,6vw,56px) "Orbitron",sans-serif;color:#fff;letter-spacing:.1em;text-align:center}
.uplink.on{display:flex;animation:gl .25s infinite steps(2)}
#matrix{position:fixed;inset:0;z-index:45;pointer-events:none;display:none}
@media(max-width:700px){.win{left:8px!important;right:8px;width:auto!important;top:46px!important;height:calc(100vh - 56px)!important}.icons{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));grid-template-rows:none;grid-auto-rows:96px;right:10px;bottom:auto}}
@media(prefers-reduced-motion:reduce){#fx,.pon,.win,.lock .big{animation:none}.poff{animation-duration:.01s}}
</style>
</head>

 const hp=g.hosp;c.save();c.shadowColor='#3dff9a';c.shadowBlur=18;c.strokeStyle='#3dff9a';c.lineWidth=2;c.strokeRect(hp.x+rw*.7,hp.y-rw*.7-sp*.32,sp*.32,sp*.32);c.fillStyle='#3dff9a';const hx=hp.x+rw*.7+sp*.16,hy=hp.y-rw*.7-sp*.16,s=sp*.05;c.fillRect(hx-s,hy-s*3,s*2,s*6);c.fillRect(hx-s*3,hy-s,s*6,s*2);c.restore();
 // route
 const a=g.amb;if(a){const p=vpos(a);c.save();c.strokeStyle='#19f0ff';c.shadowColor='#19f0ff';c.shadowBlur=10;c.lineWidth=2;c.setLineDash([4,7]);c.lineDashOffset=-t*30;c.beginPath();c.moveTo(p.x,p.y);for(let k=a.k+1;k<a.pts.length;k++)c.lineTo(a.pts[k].x,a.pts[k].y);c.stroke();c.restore()}
 // lights
 const onRoute=new Set(a?a.pts.slice(a.k+1).map(p=>p.node).filter(Boolean):[]);
 for(const k in g.lights){const l=g.lights[k],x=ox+l.i*sp,y=oy+l.j*sp,r=rw*.55;
  const gH=l.axis==='H',cG='#3dff9a',cR='#ff3b5c';c.save();c.shadowBlur=8;
  c.fillStyle=gH?cG:cR;c.shadowColor=c.fillStyle;c.fillRect(x-r-4,y-2,4,4);c.fillRect(x+r,y-2,4,4);
  c.fillStyle=gH?cR:cG;c.shadowColor=c.fillStyle;c.fillRect(x-2,y-r-4,4,4);c.fillRect(x-2,y+r,4,4);c.restore();
  if(l.glitch){c.strokeStyle=`rgba(255,176,32,${.4+.3*Math.sin(t*6)})`;c.lineWidth=2;c.beginPath();c.arc(x,y,r+8,0,7);c.stroke()}
  if(onRoute.has(k)){c.strokeStyle='#19f0ff55';c.lineWidth=1;c.beginPath();c.arc(x,y,r+13,0,7);c.stroke()}
  if(l.hack>0){c.strokeStyle='#ff2bd6';c.lineWidth=3;c.beginPath();c.arc(x,y,r+8,-Math.PI/2,-Math.PI/2+l.hack/.35*Math.PI*2);c.stroke()}}
 // vehicles
 for(const v of g.veh){const p=vpos(v),d=vdir(v),ang=Math.atan2(d.y,d.x);c.save();c.translate(p.x,p.y);c.rotate(ang);
  if(v.amb){const fl=Math.floor(t*6)%2;c.shadowColor=fl?'#ff3b5c':'#2b7bff';c.shadowBlur=22;c.fillStyle='#ffffff';c.fillRect(-sp*.09,-sp*.045,sp*.18,sp*.09);c.fillStyle=fl?'#ff3b5c':'#2b7bff';c.fillRect(-sp*.02,-sp*.045,sp*.04,sp*.09)}
  else{c.shadowColor=v.col;c.shadowBlur=10;c.fillStyle=v.col;c.fillRect(-sp*.06,-sp*.035,sp*.12,sp*.07);c.fillStyle='#fff8';c.fillRect(sp*.04,-sp*.03,sp*.02,sp*.06)}
  c.restore()}
}
function drawEcg(){const w=ecg.width,h=ecg.height,v=G?G.vit:100,col=v>50?'#3dff9a':v>25?'#ffb020':'#ff3b5c';ex.fillStyle='#03060d';ex.fillRect(0,0,w,h);ex.strokeStyle=col;ex.shadowColor=col;ex.shadowBlur=6;ex.lineWidth=2;ex.beginPath();
 const sp=1.4+(100-v)/60;for(let x=0;x<w;x++){const ph=((x/w*3+beats*sp)%1),y=ph>.45&&ph<.5?h*.1:ph>.5&&ph<.55?h*.9:h/2;x?ex.lineTo(x,y):ex.moveTo(x,y)}ex.stroke();$('vnum').textContent=Math.ceil(v);$('vnum').style.color=col}
function cityLoop(now){if(!G||G.done)return;const dt=Math.min(.05,(now-clast)/1000);clast=now;beats+=dt;cityStep(dt);if(!G||G.done)return;cityDraw();drawEcg();$('ctime').textContent=G.t.toFixed(1);$('chacks').textContent=G.hacks;craf=requestAnimationFrame(cityLoop)}
function cityEnd(won){const g=G;g.done=true;cityDraw();drawEcg();
 const rank=won?(g.vit>60?'Ghost':g.vit>30?'Operator':'Rookie'):'—';
 if(won){chime();clog('Patient delivered. Vitals stable.','ok')}else{cbeep(160,1.2,'sine',.06);clog('Patient lost.','bad')}
 panel(`<div class="cbox"><h2 class="${won?'ok':'bad'}">${won?'PATIENT STABLE':'FLATLINE'}</h2><p>${won?`The ambulance reached St Lucien General with ${Math.ceil(g.vit)}% vitals. Rank: <b class="k">${rank}</b>.`:`The ambulance didn't make it. The traffic AI won this round.`}</p>
 <div class="cstats"><div><b>${g.t.toFixed(1)}s</b>Time</div><div><b>${g.hacks}</b>Lights hacked</div><div><b>${Math.ceil(g.vit)}%</b>Vitals</div></div>
 <div class="cbtns"><button class="cbtn" type="button" data-lv="${g.n}">Retry</button>${won&&g.n<2?`<button class="cbtn mg" type="button" data-lv="${g.n+1}">Level ${g.n+2}<small>${LV[g.n+1].name}</small></button>`:''}<button class="cbtn ghost" type="button" data-jackout>Jack out</button></div></div>`)}
cv.addEventListener('pointerdown',e=>{if(!G||G.done)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null,bd=G.sp*.42;
 for(const k in G.lights){const l=G.lights[k],d=Math.hypot(G.ox+l.i*G.sp-x,G.oy+l.j*G.sp-y);if(d<bd){bd=d;best=l}}
 if(best&&best.hack===0&&!(best.cd>0)){best.hack=.001;cbeep(700,.03,'square',.02)}});
function jackOut(){if(G)G.done=true;G=null;cancelAnimationFrame(craf);$('cpanel').classList.remove('on');show('desk')}
$('cexit').onclick=jackOut;
$('city').addEventListener('click',e=>{const b=e.target.closest('[data-lv]');if(b){startLevel(+b.dataset.lv);return}if(e.target.closest('[data-jackout]'))jackOut()});
/* boot */
async function type(el,lines){for(const [t,ms] of lines){if(skip)break;el.textContent+=t;beep(1600,.01,'square',.015);await wait(ms)}}
async function boot(){
 if(booting)return;booting=true;skip=false;Object.values(wins).forEach(w=>w.remove());for(const k in wins)delete wins[k];
 const crt=$('crt');crt.classList.remove('poff');show('bios');crt.classList.add('pon');setTimeout(()=>crt.classList.remove('pon'),700);
 beep(60,.4,'sine',.08);const b=$('bios');b.innerHTML='';const pre=document.createElement('div');b.appendChild(pre);
 const hint=document.createElement('div');hint.className='hint';hint.textContent='Tap or press Esc to skip';b.appendChild(hint);
 await type(pre,[['OLUSESI BIOS v1.0  (C) 2026 Abdulmalik Systems\n',250],['CPU: Ambition-486 @ 66 MHz\n',200]]);
 for(let m=0;m<=640&&!skip;m+=64){pre.textContent=pre.textContent.replace(/Memory test: .*\n?$/,'')+`Memory test: ${m}K${m===640?' OK\n':''}`;beep(2200,.008,'square',.01);await wait(40)}
 await type(pre,[['Detecting drives…\n',350],['  Drive A: PROJECTS (13 found)\n',180],['  Drive B: IDEAS (too many)\n',180],['  Drive C: SLEEP (not found)\n',300],['\nBooting ABDULMALIK OS',300],['.',250],['.',250],['.\n',300]]);
 show('splash');const lb=$('lbar');lb.innerHTML='<i></i>'.repeat(14);const bars=[...lb.children],msgs=['Starting up…','Loading projects…','Warming up the CRT…','Compiling personality…','Almost there…'];
 for(let i=0;i<bars.length;i++){bars[i].style.opacity=1;$('lmsg').textContent=msgs[Math.floor(i/3)];await wait(skip?15:110+Math.random()*120)}
 await wait(skip?50:300);show('desk');chime();tick();booting=false;
}
function tick(){const d=new Date();$('clk').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
setInterval(tick,15000);
async function shutdown(){closeMenu();beep(400,.25,'triangle',.05);beep(200,.4,'triangle',.05,.2);const crt=$('crt');crt.classList.add('poff');await wait(750);show('bye');crt.classList.remove('poff');crt.classList.add('pon');setTimeout(()=>crt.classList.remove('pon'),700)}
/* events */
const power=()=>{if($('off').classList.contains('on')||$('bye').classList.contains('on'))boot();else if($('bsod').classList.contains('on'))boot();else if(booting)skip=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&booting){skip=true;return}if(!$('desk').classList.contains('on')&&!booting)power()});
['off','bye','bsod','bios','splash'].forEach(id=>$(id).addEventListener('click',power));
function closeMenu(){$('drop').classList.remove('on');$('mlogo').setAttribute('aria-expanded','false')}
$('mlogo').onclick=e=>{e.stopPropagation();const on=!$('drop').classList.contains('on');$('drop').classList.toggle('on',on);$('mlogo').setAttribute('aria-expanded',on)};
document.addEventListener('click',e=>{if(!e.target.closest('#drop,#mlogo'))closeMenu();
 const o=e.target.closest('[data-open]');if(o){closeMenu();APPS[o.dataset.open]?.()}
 const p=e.target.closest('[data-proj]');if(p){const P=PROJ.find(x=>x.id===p.dataset.proj);launch('p-'+P.id,P.name,projHTML(P),460)}
 const th=e.target.closest('[data-th]');if(th)setTheme(th.dataset.th);
 if(e.target.closest('[data-fx]')){document.body.classList.toggle('nofx');wins.settings.querySelector('.wb').innerHTML=settingsHTML()}});
$('snd').onclick=()=>{sound=!sound;$('snd').textContent='Sound: '+(sound?'on':'off')};
$('restart').onclick=()=>{closeMenu();boot()};$('shut').onclick=shutdown;
$('off').focus();
}
